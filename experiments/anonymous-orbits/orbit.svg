<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Anonymous orbital system: six animated nodes around a neutral center</title>
<desc id="desc">An original decorative demo. Six neutral nodes labelled 01 through 06 circulate at independent speeds around a central SYSTEM label. With reduced motion enabled, all nodes remain still.</desc>
<style>
:root{color-scheme:dark}
svg{display:block;width:100%;height:auto;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.background{fill:url(#space)}
.haze{fill:url(#haze)}
.orbit{fill:none;stroke:#7690c7;stroke-width:1.5;stroke-dasharray:3 8}
.star{fill:#c9dcff}
.soft{animation:glow 5.8s ease-in-out infinite}
.stars-a{animation:twinkle 4s ease-in-out infinite}
.stars-b{animation:twinkle 6s ease-in-out -2.4s infinite}
.satellite{offset-rotate:0deg;animation:travel var(--speed) linear var(--delay) infinite;offset-distance:0%;offset-path:var(--track)}
.tile{fill:#152540;stroke:#7a97c3;stroke-width:1.3}
.satellite text{font-size:12px;fill:#dbe8fd;font-weight:600;letter-spacing:1.1px}
.center-title{font-weight:800;letter-spacing:7px;fill:#f1f7ff;font-size:39px}
.center-sub{font-weight:500;letter-spacing:4px;fill:#8faacc;font-size:12px}
.hint{font-size:13px;fill:#a5bbdc;letter-spacing:2px}
@keyframes travel{from{offset-distance:0%}to{offset-distance:100%}}
@keyframes twinkle{0%,100%{opacity:.9}50%{opacity:.2}}
@keyframes glow{0%,100%{opacity:.62}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){
.satellite,.soft,.stars-a,.stars-b{animation:none!important}
.satellite{offset-path:none!important}
.s1{transform:translate(865px,300px)}.s2{transform:translate(535px,190px)}.s3{transform:translate(735px,300px)}
.s4{transform:translate(335px,300px)}.s5{transform:translate(675px,416px)}.s6{transform:translate(465px,300px)}
}</style>
<defs>
<linearGradient id="space" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071122"/><stop offset=".55" stop-color="#0a1d36"/><stop offset="1" stop-color="#18183b"/></linearGradient>
<radialGradient id="haze"><stop stop-color="#2c4f91" stop-opacity=".39"/><stop offset="1" stop-color="#081325" stop-opacity="0"/></radialGradient>
<radialGradient id="core"><stop stop-color="#4462a7" stop-opacity=".45"/><stop offset="1" stop-color="#101f3b" stop-opacity="0"/></radialGradient>
</defs>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Anonymous orbital study — local preview</title>
<style>
:root{color-scheme:dark;background:#090f1b;color:#e6f0ff;font:16px/1.5 system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:clamp(12px,3vw,42px)}
main{width:min(1200px,100%)}
h1{font-size:clamp(1.05rem,2.6vw,1.6rem);margin:0 0 1rem;letter-spacing:.025em}
picture,img{display:block;width:100%}
img{height:auto;border:0;border-radius:24px;background:#0c1930}
p{color:#a9bfdf;font-size:.87rem;margin:12px 0 0}
@media(max-width:640px){body{padding:10px}p{font-size:.8rem}}
</style>
</head>
<body>
<main>
<h1>Anonymous orbital animation · study 002</h1>
<picture>
  <source media="(prefers-reduced-motion: reduce) and (max-width: 640px)" srcset="orbit-mobile-static.svg">
  <source media="(prefers-reduced-motion: reduce)" srcset="orbit-static.svg">
  <source media="(max-width: 640px)" srcset="orbit-mobile.svg">
  <img src="orbit.svg" alt="Six anonymous numbered nodes on three orbits around a clear central CORE label. Reduced-motion settings show still artwork.">
</picture>
<p>Standalone local preview. No external data, scripts or tracking. The image source switches to a motion-free SVG when reduced motion is requested.</p>
</main>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
<title id="title">Anonymous orbital study mobile layout</title>
<desc id="desc">Six evenly spaced neutral nodes circle a central core at an accessible mobile scale. Reduced motion keeps them stationary.</desc>
<style>svg{display:block;width:100%;height:auto;font-family:system-ui,Arial,sans-serif}
.mobile-node{transform-origin:0 0;transform-box:view-box;animation:round 30s linear infinite;animation-delay:var(--delay)}
.tile{fill:#172747;stroke:#a2b9df;stroke-width:1.4}
.node-num{font-size:17px;font-weight:750;fill:#eaf3ff;letter-spacing:1px}
.center-title{font-size:46px;font-weight:800;letter-spacing:6px;fill:#f2f8ff}
.center-subtitle{font-size:13px;letter-spacing:3.8px;fill:#a7bde0}
.orbit{fill:none;stroke:#8ca6d0;stroke-width:1.6;stroke-dasharray:3 8;opacity:.48}
.star{fill:#c0dbfd;opacity:.5}

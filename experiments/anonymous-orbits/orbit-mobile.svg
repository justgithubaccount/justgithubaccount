<circle cx="300" cy="300" r="92" fill="none" stroke="#6c8fc6" opacity=".35"/>
<circle cx="300" cy="300" r="81" fill="#0b203b" stroke="#9bb6df" stroke-width="1.6"/>
<g text-anchor="middle"><text class="center-title" x="300" y="305">CORE</text><text class="center-subtitle" x="300" y="332">DEMO</text></g>
